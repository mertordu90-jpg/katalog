<body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500;600&family=Vazirmatn:wght@300;400;500;600&display=swap">
<style>
/* Layout: sahnede ortalanmış kitap; masaüstünde çift sayfa, telefonda tek sayfa. Sayfalar sabit kâğıt rengindedir, sahne temaya uyar. */
:root{
  --stage:#DAD6D0; --stage-fg:#1F2A30; --stage-soft:#5B666C; --stage-line:rgba(31,42,48,.16); --btn:#F5F3F0;
  --paper:#F6F4F1; --paper-2:#ECE5E0; --ink:#1F2A30; --ink-soft:#58656B; --accent:#3D6B65; --blush:#D7B4A9;
  --cover:#17302F; --cover-fg:#EFE6DD; --gold:#C6A27F; --line:rgba(31,42,48,.14); --wa:#2E7D5B;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stage:#101516;--stage-fg:#E9E4DE;--stage-soft:#97A2A3;--stage-line:rgba(233,228,222,.16);--btn:#1C2425;color-scheme:dark}}
:root[data-theme="dark"]{--stage:#101516;--stage-fg:#E9E4DE;--stage-soft:#97A2A3;--stage-line:rgba(233,228,222,.16);--btn:#1C2425;color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--stage);color:var(--stage-fg);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 6px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--display);font-weight:500;font-size:18px;white-space:nowrap}
.brand span{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--stage-soft)}
.tools{display:flex;align-items:center;gap:8px}
.lang{appearance:none;-webkit-appearance:none;background:var(--btn);color:var(--stage-fg);border:1px solid var(--stage-line);border-radius:999px;padding:8px 28px 8px 12px;font:500 13px var(--body);cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 11px) 52%;background-size:4px 4px;background-repeat:no-repeat}
.snd{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--stage-line);background:var(--btn);color:var(--stage-fg);display:grid;place-items:center;cursor:pointer;padding:0}
.snd svg{width:18px;height:18px}
.snd .off,.snd[aria-pressed=false] .on{display:none}
.snd[aria-pressed=false] .off{display:block}
.snd:focus-visible{outline:2px solid var(--blush);outline-offset:2px}
.wa{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;text-decoration:none;font-size:13px;font-weight:500;padding:9px 14px;border-radius:999px;white-space:nowrap}
.wa:focus-visible,.ctrl button:focus-visible,.ctrl input:focus-visible,.lang:focus-visible{outline:2px solid var(--blush);outline-offset:2px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.wrap{position:relative}
.book{position:absolute;left:0;top:0;transform-origin:top left;perspective:2600px}
.spread{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.45,.05,.3,1)}
.leaf{position:absolute;top:0;transform-origin:left center;transform-style:preserve-3d;will-change:transform;transition:transform .8s cubic-bezier(.645,.045,.355,1),opacity .2s;cursor:pointer}
.leaf.flipped{transform:rotateY(-180deg)}
.single .leaf.flipped{opacity:0;transition:transform .8s cubic-bezier(.645,.045,.355,1),opacity .22s .55s}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 22px 22px -19px rgba(0,0,0,.42)}
.face.back{transform:rotateY(180deg)}
.face.front::after,.face.back::after{content:"";position:absolute;top:0;bottom:0;width:38px;pointer-events:none;z-index:5}
.face.front::after{left:0;background:linear-gradient(90deg,rgba(0,0,0,.13),rgba(0,0,0,0))}
.face.back::after{right:0;background:linear-gradient(270deg,rgba(0,0,0,.13),rgba(0,0,0,0))}
.face.nocrease::after{display:none}
.ctrl{display:flex;align-items:center;gap:12px;padding-block:6px max(14px,env(safe-area-inset-bottom,0px));max-width:620px;width:100%;margin-inline:auto}
.ctrl button{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--stage-line);background:var(--btn);color:var(--stage-fg);font-size:18px;cursor:pointer;display:grid;place-items:center}
.ctrl button:disabled{opacity:.35;cursor:default}
.ctrl input{flex:1;min-width:0;accent-color:var(--accent)}
.count{flex:none;font-size:12px;letter-spacing:.08em;color:var(--stage-soft);font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
@media (max-width:560px){.wa .t{display:none}.wa{padding:9px 11px}.brand b{font-size:16px}.brand span{display:none}}

/* ---------- sayfa (440 × 620, ölçeklenir) ---------- */
.pg{position:absolute;inset:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:12.5px;line-height:1.55;padding:42px 40px 46px;overflow:hidden;cursor:pointer}
.pg .in{height:100%;overflow:hidden}
.pg .z{display:flex;flex-direction:column;gap:14px}
.pg h2{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.1;letter-spacing:-.01em;margin:0;text-wrap:balance}
.pg h2 em{font-style:italic;color:var(--accent)}
.pg h3{font-family:var(--display);font-weight:500;font-size:16px;margin:0;line-height:1.25}
.pg p{margin:0}
.eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:500}
.lead{font-size:12.5px;color:var(--ink-soft);line-height:1.6}
.rule{height:1px;background:var(--line);flex:none}
.folio{position:absolute;left:40px;right:40px;bottom:18px;display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.folio i{font-style:normal;font-variant-numeric:tabular-nums}
.note{font-size:10.5px;color:var(--ink-soft);font-style:italic}
.list{display:flex;flex-direction:column}
.list .it{display:flex;flex-direction:column;gap:1px;padding-block:6.5px;border-top:1px solid var(--line)}
.list .it:last-child{border-bottom:1px solid var(--line)}
.list .it b{font-weight:500;font-size:13px}
.list .it span{color:var(--ink-soft);font-size:11.8px;line-height:1.5}
.spec{display:grid;grid-template-columns:repeat(4,1fr);margin:0;border:1px solid var(--line);border-radius:3px;background:var(--paper-2)}
.spec div{padding:9px 10px;border-inline-start:1px solid var(--line)}
.spec div:first-child{border-inline-start:0}
.spec dt{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.spec dd{margin:2px 0 0;font-family:var(--display);font-size:14px;font-variant-numeric:tabular-nums}
.tick{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tick li{padding-inline-start:18px;position:relative;font-size:12px}
.tick li::before{content:"";position:absolute;inset-inline-start:2px;top:7px;width:7px;height:7px;border:1px solid var(--accent);border-radius:50%}
a.ask{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--wa);color:#fff;vertical-align:2px;margin-inline-start:6px;text-decoration:none;flex:none}
a.ask svg{width:10px;height:10px}
a.ask:hover{filter:brightness(1.1)}
a.more{color:inherit;text-decoration:none;border-bottom:1px solid rgba(61,107,101,.35)}
a.more i{font-style:normal;font-family:var(--body);font-size:10px;color:var(--accent);margin-inline-start:3px}
a.ask:focus-visible,a.more:focus-visible,a.artlink:focus-visible,.pg [data-go]:focus-visible,.pg [data-zone]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* kapak */
.cover{background:radial-gradient(120% 75% at 50% 30%,#26443F 0%,#17302F 55%,#0F211F 100%);color:var(--cover-fg);padding:48px 46px 44px}
.cover .z,.backc .z{height:100%;justify-content:space-between}
.cover .z{align-items:center;text-align:center}
.cframe{position:absolute;inset:14px;border:1px solid rgba(198,162,127,.5);pointer-events:none}
.cframe::before{content:"";position:absolute;inset:5px;border:1px solid rgba(198,162,127,.22)}
.ckick{display:flex;align-items:center;gap:12px;font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.ckick::before,.ckick::after{content:"";width:28px;height:1px;background:var(--gold);opacity:.7}
.arch{width:150px;height:190px;flex:none;overflow:visible}
.cname{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.02;letter-spacing:-.01em}
.cname small{display:block;font-size:13px;letter-spacing:.38em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;font-family:var(--body);font-weight:500}
.cname em{font-style:italic;color:#E3C9A8}
.ctitle{display:flex;flex-direction:column;align-items:center;gap:8px}
.ctitle span{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--cover-fg)}
.ctitle b{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.3em;color:var(--gold)}
.ctitle i{width:40px;height:1px;background:var(--gold)}
.cbot{display:flex;flex-direction:column;align-items:center;gap:10px}
.cfill{display:flex;align-items:center;gap:10px;font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:#E3C9A8}
.cfill i{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.8}
.pg[dir=rtl] .cfill{letter-spacing:0}
.cshine{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.cshine::before{content:"";position:absolute;top:-20%;bottom:-20%;width:38%;left:0;will-change:transform;background:linear-gradient(105deg,rgba(233,207,168,0) 0%,rgba(233,207,168,.10) 40%,rgba(255,240,215,.15) 50%,rgba(233,207,168,.10) 60%,rgba(233,207,168,0) 100%);transform:skewX(-12deg);animation:cshine 9s ease-in-out 1.2s infinite both}
@keyframes cshine{0%{transform:translateX(-160%) skewX(-12deg)}22%{transform:translateX(330%) skewX(-12deg)}100%{transform:translateX(330%) skewX(-12deg)}}
@media (prefers-reduced-motion:reduce){.cshine::before{animation:none;display:none}}
.cfoot{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:rgba(239,230,221,.62)}

/* içindekiler */
.toc{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}
.toc a{display:flex;align-items:baseline;gap:6px;padding-block:5px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:11.8px;min-width:0}
.toc a span{min-width:0}
.toc a .dots{flex:1;border-bottom:1px dotted rgba(31,42,48,.3);transform:translateY(-3px);min-width:6px}
.toc a i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--accent);font-size:11px}
.toc a:hover{color:var(--accent)}

/* şikâyetler */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--paper-2);border-radius:3px;text-decoration:none;color:var(--ink);position:relative}
.tile b{font-family:var(--display);font-weight:500;font-size:14.5px;line-height:1.2;padding-inline-end:24px}
.tile span{font-size:10.8px;color:var(--ink-soft);line-height:1.4}
.tile i{position:absolute;top:10px;inset-inline-end:10px;font-style:normal;font-size:10px;color:var(--accent);font-variant-numeric:tabular-nums}
.tile:hover{background:#E4DAD3}

/* yüz haritası */
.fmap{display:grid;grid-template-columns:172px 1fr;gap:16px;align-items:start}
.fmap svg{width:172px;height:auto;display:block}
.fmap [data-zone]{cursor:pointer}
.fmap circle.hot{fill:transparent}
.fmap circle.ring{fill:none;stroke:none}
.fmap g.zd circle.dot{fill:#fff;stroke:var(--accent);stroke-width:2}
.fmap g.zd.on circle.dot{fill:var(--accent)}
.fmap g.zd.on circle.ring{stroke:var(--accent);stroke-opacity:.35;stroke-width:6;fill:none}
.zpanel{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.zpanel small{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.zpanel h3{font-size:24px;font-weight:400}
.zpanel a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:12.5px}
.zpanel a:last-child{border-bottom:1px solid var(--line)}
.zpanel a i{font-style:normal;color:var(--accent);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font:500 11px var(--body);color:var(--ink);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* hakkında */
.dport{position:relative;height:228px;border-radius:3px;overflow:hidden;margin-bottom:14px;background:linear-gradient(165deg,#24443F,#122624);flex:none}
.dport img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%}
.dport::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(14,30,28,.82),rgba(14,30,28,0) 48%);pointer-events:none}
.dport::before{content:"";position:absolute;inset:8px;border:1px solid rgba(198,162,127,.45);border-radius:2px;z-index:2;pointer-events:none}
.dport.has{height:272px;background:radial-gradient(60% 75% at 72% 40%,#2F5650 0%,#1A3532 55%,#102321 100%)}
.dport.has img{inset:auto;top:16px;inset-inline-end:14px;width:188px;height:auto;object-fit:contain;z-index:1;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.dport.has::after{background:linear-gradient(to top,rgba(14,30,28,.55),rgba(14,30,28,0) 35%)}
.dport.has .dcap{max-width:52%}
.dport .dini{position:absolute;inset-inline-end:22px;top:6px;font-family:var(--display);font-style:italic;font-size:150px;line-height:1;color:rgba(198,162,127,.22)}
.dport .dsoon{position:absolute;top:44%;inset-inline-start:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(239,230,221,.55)}
[dir=rtl] .dport .dsoon{transform:translate(50%,-50%)}
.dport .dsoon svg{width:30px;height:30px}.dport .dsoon i{font-style:normal;font-size:9px;letter-spacing:.16em;text-transform:uppercase}
.dport .badge{z-index:3}
.dcap{position:absolute;inset-inline-start:20px;bottom:18px;z-index:3;color:var(--cover-fg)}
.dcap span{display:block;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.dcap b{display:block;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15}
.dfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap}
.sig{height:54px;width:auto;display:block;margin-inline-start:-6px}
.portrait{height:170px;border-radius:2px;background:linear-gradient(160deg,var(--paper-2),#DCCBC3);position:relative;overflow:hidden;flex:none}
.portrait .ini{position:absolute;inset-inline-end:18px;bottom:2px;font-family:var(--display);font-size:120px;line-height:1;color:rgba(61,107,101,.18)}
.portrait .cap{position:absolute;inset-inline-start:18px;bottom:16px}
.portrait .cap b{display:block;font-family:var(--display);font-weight:400;font-size:24px}
.portrait .cap span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.badge{position:absolute;top:14px;inset-inline-start:16px;display:inline-flex;align-items:center;gap:6px;background:var(--cover);color:var(--gold);font-size:9px;letter-spacing:.18em;text-transform:uppercase;padding:6px 10px;border-radius:999px;z-index:3}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.stats div{padding:10px 0;border-bottom:1px solid var(--line)}
.stats div:nth-child(odd){padding-inline-end:14px;border-inline-end:1px solid var(--line)}
.stats div:nth-child(even){padding-inline-start:16px}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;font-variant-numeric:lining-nums}
.stats span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.edu{display:flex;flex-direction:column;gap:6px}
.edu div{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:12px}
.edu div b{font-weight:500;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);padding-top:2px}
.certs{display:flex;flex-wrap:wrap;gap:6px}
.certs span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:10.8px;background:var(--paper)}
.certs span.g{background:var(--cover);color:var(--gold);border-color:var(--cover)}

/* güvenlik */
.safe{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.safe div{display:flex;flex-direction:column;gap:4px;padding:12px;border:1px solid var(--line);border-radius:3px}
.safe svg{width:22px;height:22px;color:var(--accent)}
.safe b{font-family:var(--display);font-weight:500;font-size:14.5px}
.safe span{font-size:11.2px;color:var(--ink-soft);line-height:1.45}

/* süreç */
.steps{display:flex;flex-direction:column}
.steps .st{display:grid;grid-template-columns:44px 1fr;gap:12px;padding-block:10px;border-top:1px solid var(--line)}
.steps .st:last-child{border-bottom:1px solid var(--line)}
.steps .st .n{font-family:var(--display);font-size:28px;line-height:1;color:var(--accent)}
.steps .st b{font-weight:500;font-size:13px;display:block}
.steps .st span{font-size:11.8px;color:var(--ink-soft)}

/* botoks bölgeleri */
.zones{display:grid;grid-template-columns:168px 1fr;gap:16px;align-items:center;position:relative}
.zones svg{width:168px;height:auto;display:block}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:11.8px}
.legend li{display:grid;grid-template-columns:20px 1fr;gap:6px;align-items:baseline}
.legend li i{font-style:normal;width:17px;height:17px;border-radius:50%;background:var(--accent);color:#fff;font-size:9.5px;display:grid;place-items:center;font-weight:500}

/* ürün görselleri */
.art{background:linear-gradient(170deg,#F4F0EB,#E3D8D0);border-radius:3px;height:84px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;flex:none}
.art::before{content:"";position:absolute;left:10%;right:10%;top:-30%;height:90%;background:radial-gradient(closest-side,rgba(255,255,255,.8),rgba(255,255,255,0))}
.art svg{position:relative;height:100%;width:auto;max-width:100%;display:block}
.art img{width:100%;height:100%;object-fit:cover;position:relative}
.row .art .row a.artlink{display:block;text-decoration:none;color:inherit;border-radius:3px}
a.artlink:hover .art{outline:1px solid var(--accent);outline-offset:-1px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.cards.one{grid-template-columns:1fr}
.card{display:flex;flex-direction:column;gap:2px;min-width:0}
.card > .art,.card > .artlink{margin-bottom:6px}
.card small,.row small{display:block;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}

/* bir bakışta */

    if(k==='age'){QZ.age=j;QZ.s=1;}
    else if(k==='con'){if(QZ.con!==j)QZ.det=[];QZ.con=j;QZ.s=2;}
    else if(k==='det'){const i=QZ.det.indexOf(j);if(i<0)QZ.det.push(j);else QZ.det.splice(i,1);}
    else if(k==='next'){QZ.s=3;}
    else if(k==='dt'){QZ.dt=j;QZ.s=4;}
    else if(k==='res'){QZ.res=j;QZ.s=5;}
    else if(k==='exp'){QZ.exp=j;QZ.s=6;}
    else if(k==='back'){QZ.s=Math.max(0,QZ.s-1);}
    else if(k==='invite'){QZ.s=7;}
    else if(k==='res6'){QZ.s=6;}
    else if(k==='day'){QZ.day=j;}
    else if(k==='time'){QZ.time=j;}
    else if(k==='restart'){Object.assign(QZ,{s:0,age:null,con:null,det:[],dt:null,res:null,exp:null});}
  }
  function refit(f){const inn=f.querySelector('.in'),z=f.querySelector('.z');if(!inn||!z)return;z.style.zoom='';const r=inn.clientHeight/z.scrollHeight;if(r<1)z.style.zoom=Math.max(.68,r-.008).toFixed(3);}
  function zoneHTML(k){const z=L.facemap.zones[k];return '<small>'+L.facemap.hint+'</small><h3>'+z[0]+'</h3><div>'+z[1].map(([t,id])=>'<a href="#" data-go="'+id+'"><span>'+t+'</span><i>'+AR()+' '+pnum(id)+'</i></a>').join('')+'</div>';}

  function renderPages(){
    gid=0;
    return ORDER.map((id,i)=>{
      const r=R[id]();
      const s=document.createElement('section');
      s.className='pg '+(r.cls||'');
      s.setAttribute('lang',L.code); s.setAttribute('dir',L.dir);
      s.innerHTML='<div class="in"><div class="z">'+r.html+'</div></div>'+(r.sec?'<div class="folio"><span>'+(L.sec[r.sec]||L.tower.toc)+'</span><i>'+String(i+1).padStart(2,'0')+'</i></div>':'');
      return s;
    }).reduce((acc,s,i,arr)=>{if(i===arr.length-1&&arr.length%2===1){const b=document.createElement('section');b.className='pg blankback';acc.push(b);}acc.push(s);return acc;},[]);
  }

  // ---- kitap ----
  const book=document.getElementById('book'),spread=document.getElementById('spread'),wrap=document.getElementById('wrap'),stage=document.getElementById('stage');
  const prev=document.getElementById('prev'),next=document.getElementById('next'),range=document.getElementById('range'),count=document.getElementById('count'),langSel=document.getElementById('lang');
  let src=[],N=0,mode=null,leaves=[],c=0,Lc=0,timers=[],zTop=0;
  const pageToC=p=>mode==='spread'?Math.ceil(p/2):p;
  const cToPage=()=>mode==='spread'?(c===0?0:Math.min(2*c-1,N-1)):c;
  const maxC=()=>mode==='spread'?Lc:N-1;
  function face(node,cls){const el=node.cloneNode(true);el.classList.add('face',cls);return el;}
  function fitAll(){
    spread.querySelectorAll('.face.pg').forEach(f=>{
      if(f.classList.contains('nofit')) return;
      const inn=f.querySelector('.in'),z=f.querySelector('.z'); if(!inn||!z) return;
      z.style.zoom=''; const r=inn.clientHeight/z.scrollHeight;
      if(r<1) z.style.zoom=Math.max(.68,r-.008).toFixed(3);
    });
  }
  function build(newMode,keepPage){
    const p=keepPage!=null?keepPage:cToPage();
    mode=newMode; spread.innerHTML=''; leaves=[];
    book.classList.toggle('single',mode==='single');
    Lc=mode==='spread'?Math.ceil(N/2):N;
    for(let k=0;k<Lc;k++){
      const lf=document.createElement('div'); lf.className='leaf';
      lf.style.width=W+'px'; lf.style.height=H+'px'; lf.style.left=(mode==='spread'?W:0)+'px';
      lf.appendChild(face(mode==='spread'?src[2*k]:src[k],'front'));
      const bk=mode==='spread'?src[2*k+1]:null;
      if(bk) lf.appendChild(face(bk,'back')); else {const b=document.createElement('div');b.className='pg blankback face back';lf.appendChild(b);}
      spread.appendChild(lf); leaves.push(lf);
    }
    c=Math.min(pageToC(p),maxC());
    book.style.width=(mode==='spread'?2*W:W)+'px'; book.style.height=H+'px';
    leaves.forEach(l=>l.style.transition='none'); spread.style.transition='none';
    render(); fit(); fitAll();
    void spread.offsetWidth; leaves.forEach(l=>l.style.transition=''); spread.style.transition='';
  }
  const zFor=i=>i<c?i+1:Lc-i;
  function shift(){let sx=0;if(mode==='spread'){if(c===0)sx=-W/2;else if(c===Lc)sx=W/2;}spread.style.transform='translateX('+sx+'px)';}
  function renderCount(){
    range.max=N-1; range.value=cToPage();
    if(mode==='spread'){count.textContent=c===0?L.ui.cover:(c===Lc?N+' / '+N:(2*c)+'–'+(2*c+1)+' / '+N);}
    else count.textContent=c===0?L.ui.cover:(c+1)+' / '+N;
    prev.disabled=c===0; next.disabled=c>=maxC();
  }
  function render(){zTop=0;leaves.forEach((lf,i)=>{lf.classList.toggle('flipped',i<c);lf.style.zIndex=zFor(i);});shift();renderCount();}
  function goC(t){
    t=Math.max(0,Math.min(maxC(),t)); if(t===c) return;
    timers.forEach(clearTimeout); timers=[];
    // önceki hızlı çevirmeden kalan yarım işleri tamamla: her yaprak mevcut konuma otursun
    leaves.forEach((lf,i)=>{const want=i<c;if(lf.classList.contains('flipped')!==want){lf.style.zIndex=Lc+10+(++zTop);lf.classList.toggle('flipped',want);}});
    const fwd=t>c,from=c,idx=[];
    if(fwd) for(let i=from;i<t;i++) idx.push(i); else for(let i=from-1;i>=t;i--) idx.push(i);
    const gap=idx.length>1?Math.min(90,500/idx.length):0;
    idx.forEach((i,j)=>{const go=()=>{const lf=leaves[i];lf.style.zIndex=Lc+10+(++zTop);lf.classList.toggle('flipped',fwd);};if(j===0)go();else timers.push(setTimeout(go,j*gap));});
    idx.forEach((i,j)=>{if(j<3||j===idx.length-1)flipSound(j*gap,j===0?1:.55,fwd);});
    c=t; shift(); renderCount();
    timers.push(setTimeout(render,idx.length*gap+830));
  }
  function fit(){
    const bw=mode==='spread'?2*W:W, sw=stage.clientWidth, sh=stage.clientHeight-12;
    const s=Math.max(.3,Math.min(sw/bw,sh/H,1.45));
    book.style.transform='scale('+s+')'; wrap.style.width=(bw*s)+'px'; wrap.style.height=(H*s)+'px';
  }
  const pickMode=()=>stage.clientWidth<760||stage.clientWidth/stage.clientHeight<1.05?'single':'spread';
  function setLang(code,keep){
    L=LANGS[code]||LANGS.tr; document.documentElement.lang=L.code;
    try{localStorage.setItem('mdk-lang',L.code);}catch(e){}
    langSel.value=L.code;
    document.getElementById('sub').textContent=L.ui.sub;
    document.getElementById('watxt').textContent=L.ui.wa;
    langSel.setAttribute('aria-label',L.ui.lang);
    L.sec.clinic=L.clinic.e;L.sec.tower=L.sec.tower||L.tower.toc;L.sec.quiz=L.sec.quiz||L.quiz.e;L.sec.certs=L.certs.e;L.sec.intl=L.intl.e;L.sec.quasar=L.quasar.e;L.sec.rev=L.rev.e;
    src=renderPages(); N=src.length;
    build(mode||pickMode(),keep);
  }
  langSel.innerHTML=LORDER.map(k=>'<option value="'+k+'">'+LANGS[k].short+' · '+LANGS[k].label+'</option>').join('');
  let start='tr'; try{const s=localStorage.getItem('mdk-lang'); if(s&&LANGS[s]) start=s;}catch(e){}
  {const h=(location.hash||'').slice(1).toLowerCase(); if(LANGS[h]) start=h;}
  mode=pickMode(); setLang(start,0);
  langSel.addEventListener('change',()=>setLang(langSel.value,cToPage()));
  addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1).toLowerCase(); if(LANGS[h]&&h!==L.code) setLang(h,cToPage());});
  new ResizeObserver(()=>{const m=pickMode(); if(m!==mode) build(m); else fit();}).observe(stage);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitAll);

  prev.addEventListener('click',()=>goC(c-1));
  next.addEventListener('click',()=>goC(c+1));
  range.addEventListener('input',()=>goC(pageToC(+range.value)));
  document.addEventListener('keydown',e=>{
    if(!lb.hidden){if(e.key==='Escape')lbClose();else if(e.key==='ArrowRight')lbShow(lbI+(L.dir==='rtl'?-1:1));else if(e.key==='ArrowLeft')lbShow(lbI+(L.dir==='rtl'?1:-1));return;}
    if(e.target===range||e.target===langSel||(e.target.tagName==='INPUT')) return;
    const z=e.target.closest&&e.target.closest('[data-zone]');
    if(z&&(e.key==='Enter'||e.key===' ')){e.preventDefault();setZone(z);return;}
    if(e.key==='ArrowRight'||e.key==='PageDown'){goC(c+1);e.preventDefault();}
    if(e.key==='ArrowLeft'||e.key==='PageUp'){goC(c-1);e.preventDefault();}
    if(e.key==='Home') goC(0); if(e.key==='End') goC(maxC());
  });
  function setZone(el){
    const pg=el.closest('.pg'),k=el.dataset.zone;
    pg.querySelectorAll('[data-zone]').forEach(n=>n.classList.toggle('on',n.dataset.zone===k));
    pg.querySelector('.zpanel').innerHTML=zoneHTML(k);
  }
  stage.addEventListener('input',e=>{if(e.target.id!=='qname')return;QZ.name=e.target.value;const f=e.target.closest('.pg'),a=f&&f.querySelector('.qsend');
    if(a){a.href=waHref();const ok=invReady();a.classList.toggle('off',!ok);if(ok){a.removeAttribute('aria-disabled');a.removeAttribute('tabindex');}else{a.setAttribute('aria-disabled','true');a.setAttribute('tabindex','-1');}}});
  let sx0=null,sy0=null,moved=false;
  stage.addEventListener('pointerdown',e=>{if(e.target.closest('input')){sx0=null;return;}sx0=e.clientX;sy0=e.clientY;moved=false;});
  stage.addEventListener('pointerup',e=>{if(sx0===null)return;const dx=e.clientX-sx0,dy=e.clientY-sy0;sx0=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){moved=true;goC(dx<0?c+1:c-1);}});
  stage.addEventListener('click',e=>{
    if(moved){moved=false;return;}
    const zn=e.target.closest('[data-zone]'); if(zn){setZone(zn);return;}
    const ce=e.target.closest('[data-cert]');if(ce){lbShow(+ce.dataset.cert,'cert');return;}
    const pe=e.target.closest('[data-ph]');if(pe){const [st,ix]=pe.dataset.ph.split(':');if(PHOTOS[st][+ix])lbShow(+ix,st);return;}
    const qa=e.target.closest('[data-q]');
    if(qa){const f=qa.closest('.pg'),cmd=qa.dataset.q;quizAct(cmd);
      f.querySelector('.quiz').innerHTML=quizHTML();refit(f);
      const nb=f.querySelector(cmd.startsWith('day')||cmd.startsWith('time')||cmd.startsWith('det')?'[data-q="'+cmd+'"]':'.qopt,.qchip,.tile,#qname');if(nb&&(e.detail===0||cmd==='invite'))nb.focus();return;}
    if(e.target.closest('input,label'))return;
    const go=e.target.closest('[data-go]'); if(go){e.preventDefault();goC(pageToC(IDX[go.dataset.go]));return;}
    if(e.target.closest('a,button,select')) return;
    const r=wrap.getBoundingClientRect(); if(e.clientX<r.left-20||e.clientX>r.right+20) return;
    const mid=mode==='spread'?r.left+r.width/2:r.left+r.width*.35;
    goC(e.clientX>mid?c+1:c-1);
  });
})();
</script>
