*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ttl{display:flex;flex-direction:column;min-width:0;flex:1 1 260px}
.ttl small{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:500}
html[dir=rtl] .ttl small{letter-spacing:0}
.ttl h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(20px,3vw,28px);line-height:1.15;text-wrap:balance}
.ttl h1 em{color:var(--accent)}
.tag{margin:4px 0 0;font-family:var(--display);font-style:italic;font-size:clamp(13px,1.6vw,16px);color:#8A6A4A}
html[dir=rtl] .tag{font-style:normal}
html[dir=rtl] .ttl h1 em{font-style:normal}
.tools{display:flex;gap:8px;align-items:center}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:18px;height:18px}
.ib .off,.ib[aria-pressed=false] .on{display:none}

.lang{appearance:none;-webkit-appearance:none;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 28px 9px 12px;font:500 13px var(--body);cursor:pointer;

main{flex:1;min-height:0;position:relative}
canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:manipulation}

.hud span{font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums}
.hud .nx{color:var(--accent);font-weight:500;font-size:12px}

.toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.toast i{font-style:normal;color:var(--gold)}

.go .taps i.on{background:var(--gold)}
.go.pulse{animation:pulse .5s}

.sec{border:0;background:none;color:var(--soft);font:500 13px var(--body);padding:8px 6px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}

.pb .bar{flex:1;height:5px;background:#E2DBD3;border-radius:3px;overflow:hidden}
.pb .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9DBDB7,var(--accent));transition:width .4s}
.pb span{font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}

    cloud(c){[[-.45,.1,.38],[0,-.12,.5],[.45,.08,.36],[-.15,.2,.34],[.2,.22,.32]].forEach(([x,y,r])=>{c.beginPath();c.arc(x,y,r,0,7);c.fill();});c.fillRect(-.8,.12,1.6,.32);light(c,()=>{c.beginPath();c.arc(-.05,-.25,.22,0,7);c.fill();});},
    condor(c){c.beginPath();c.moveTo(-1,-.05);c.quadraticCurveTo(-.5,-.4,-.08,-.08);c.lineTo(.08,-.08);c.quadraticCurveTo(.5,-.4,1,-.05);c.lineTo(.92,.03);c.lineTo(.84,0);c.lineTo(.76,.07);c.quadraticCurveTo(.4,-.1,.08,.12);c.lineTo(.15,.3);c.lineTo(-.15,.3);c.lineTo(-.08,.12);c.quadraticCurveTo(-.4,-.1,-.76,.07);c.lineTo(-.84,0);c.lineTo(-.92,.03);c.closePath();c.fill();c.beginPath();c.arc(0,-.14,.08,0,7);c.fill();}
  };

  const prevL=()=>stage>0?STG[Math.min(stage,STG.length)-1]:null;
  const nextL=()=>stage<STG.length?STG[stage]:null;
  function desiredTop(){const n=nextL();return Math.max((n?n.h:TOTAL_H)*1.2,dispH*1.15,.12);}

  function draw(){
    if(!W)return;
    const ground=H-30,top=28,viewTop=camTop,k=(ground-top)/viewTop,cx=W/2;
    const t=Math.min(1,Math.log10(dispH*10+1)/5);
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,mix('DCEBF1','0B2440',t));g.addColorStop(1,mix('F3F0EC','3A5A78',t*.8));
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    const colW=Math.max(5,Math.min(26,UNIT_W_CM/100*k));
    const P=prevL(),N=nextL(),shownL=[P,N].filter(Boolean);
    // dağ arka planda
    shownL.filter(l=>l.t==='mount').forEach(l=>{const hp=l.h*k;ctx.save();ctx.translate(cx+l.s*W*.28,ground);ctx.scale(hp,hp);ctx.fillStyle=l===P?'rgba(61,107,101,.6)':'rgba(70,90,105,.45)';SH.mount(ctx);ctx.restore();});
    ctx.fillStyle='#CFC6BB';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#BDB3A7';ctx.fillRect(0,ground,W,2);
    // yerdeki iki hedef: az önce geçilen ve sıradaki, kulenin hemen yanında
    shownL.filter(l=>!l.f&&l.t!=='mount').forEach(l=>{const hp=l.h*k;if(hp<3)return;const w=hp*ASPECT[l.t],x=cx+l.s*(colW/2+14+w/2);
      ctx.save();ctx.translate(x,ground);ctx.scale(hp,hp);ctx.fillStyle=l===P?'#3D6B65':'rgba(110,122,128,.75)';SH[l.t](ctx);ctx.restore();});
    // havadaki hedefler
    shownL.filter(l=>l.f).forEach(l=>{const y=ground-l.h*k,S=Math.min(30,Math.max(18,W*.026)),x=cx+l.s*(colW/2+S+16);
      ctx.save();ctx.translate(x,y);ctx.scale(S,S);ctx.fillStyle=l===P?'#C6A27F':'#EFE6DD';SH[l.t](ctx);ctx.restore();});
    // kule
    const colH=dispH*k,unitPx=UNIT_CM/100*k;
    if(colW>=8&&unitPx>=5&&shown<=900){for(let i=0;i<Math.round(shown);i++){const y=ground-(i+1)*unitPx;
        ctx.fillStyle=i%2?'#C6A27F':'#3D6B65';rr(ctx,cx-colW/2,y+.6,colW,Math.max(1,unitPx-1.2),Math.min(4,unitPx/3));
        ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(cx-colW/2+colW*.15,y+unitPx*.3,colW*.7,Math.max(1,unitPx*.1));}}
    else if(colH>0){ctx.save();ctx.shadowColor='rgba(198,162,127,'+(.55+glow*.4)+')';ctx.shadowBlur=(colW<10?10:0)+glow*18;
      const gg=ctx.createLinearGradient(cx-colW/2,0,cx+colW/2,0);gg.addColorStop(0,'#2C524D');gg.addColorStop(.45,'#8FC0B8');gg.addColorStop(1,'#2C524D');ctx.fillStyle=gg;ctx.fillRect(cx-colW/2,ground-colH,colW,colH);ctx.restore();}
    // etiketler: yalnızca iki hedef
    ctx.font='500 12.5px '+(U.dir?'Vazirmatn,Tahoma,':'Jost,')+'system-ui,sans-serif';ctx.textBaseline='middle';ctx.direction=U.dir||'ltr';ctx.textAlign='left';
    let lastY=-1e9;
    shownL.slice().sort((a,b)=>b.h-a.h).forEach(l=>{const ly=ground-l.h*k;if(ly<top-6)return;const done=l===P;
      const y=Math.max(ly,lastY+30);lastY=y;
      ctx.strokeStyle=done?'rgba(61,107,101,.55)':'rgba(31,42,48,.3)';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(cx+colW/2+4,ly);ctx.lineTo(W-14,y);ctx.stroke();ctx.setLineDash([]);
      const txt=NM[l.id]+' · '+fmtM(l.h);const tw=ctx.measureText(txt).width+16;const tx=W-14-tw;
      ctx.fillStyle=done?'rgba(23,48,47,.94)':'rgba(255,255,255,.95)';rr(ctx,tx,y-12,tw,24,12);ctx.fillStyle=done?'#EFE6DD':'#1F2A30';ctx.fillText(txt,tx+8,y+.5);});
    ctx.direction='ltr';ctx.textAlign='start';
    // uçak
    const py=ground-PLANE*k;
    if(py>top){ctx.save();ctx.translate(W*.7,py);ctx.fillStyle='#EFE6DD';ctx.beginPath();ctx.moveTo(-26,0);ctx.lineTo(22,-3);ctx.quadraticCurveTo(30,0,22,3);ctx.closePath();ctx.fill();tri(ctx,[0,-1],[-10,-16],[8,-1]);tri(ctx,[0,1],[-10,16],[8,1]);tri(ctx,[-26,0],[-30,-9],[-22,-1]);ctx.restore();
      ctx.fillStyle='rgba(239,230,221,.9)';ctx.font='500 11px '+(U.dir?'Vazirmatn,':'Jost,')+'sans-serif';ctx.textAlign='center';ctx.fillText(U.plane,W*.7,py+26);ctx.textAlign='start';}
    // tepe etiketi
    if(colH>0){const y=Math.max(top+14,ground-colH);const txt=fmtM(dispH);ctx.font='600 13px Jost,sans-serif';const tw=ctx.measureText(txt).width+18;ctx.fillStyle='#C6A27F';rr(ctx,cx-tw/2,y-32,tw,24,12);ctx.fillStyle='#17302F';ctx.textAlign='center';ctx.fillText(txt,cx,y-19.5);ctx.textAlign='start';}
  }

  // ---- tatlı sesler (Web Audio) ----
  let AC=null,OUT=null,soundOn=true;try{soundOn=localStorage.getItem('mdk-snd')!=='0';}catch(e){}
  function audio(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{AC=new C({latencyHint:'interactive'});}catch(e){return null;}
      const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.connect(AC.destination);OUT=AC.createGain();OUT.gain.value=.5;OUT.connect(comp);
      const sr=AC.sampleRate,n=Math.floor(sr*1.4),ir=AC.createBuffer(2,n,sr);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/sr/.32)*.5;}
      const cv2=AC.createConvolver();cv2.buffer=ir;const wet=AC.createGain();wet.gain.value=.22;OUT.connect(wet);wet.connect(cv2);cv2.connect(comp);}
    if(AC.state==='suspended')AC.resume();return AC;}
  const SCALE=[0,2,4,7,9,12,14,16,19,21,24];
  function note(semi,t0,vol,len){const a=AC,f=523.25*Math.pow(2,semi/12);
    [[1,1],[2.01,.28],[3.98,.08]].forEach(([m,g])=>{const o=a.createOscillator(),e=a.createGain();o.type='sine';o.frequency.value=f*m;
      e.gain.setValueAtTime(0,t0);e.gain.linearRampToValueAtTime(vol*g,t0+.006);e.gain.exponentialRampToValueAtTime(.0008,t0+len*(m>1?.5:1));o.connect(e);e.connect(OUT);o.start(t0);o.stop(t0+len+.05);});}
  function sTap(i){if(!soundOn)return;const a=audio();if(!a)return;note(SCALE[Math.min(SCALE.length-1,i)]-12,a.currentTime+.005,.32,.5);}
  function sPass(){if(!soundOn)return;const a=audio();if(!a)return;const t=a.currentTime+.01;[0,4,7,12].forEach((s,j)=>note(s,t+j*.075,.26,.9));note(24,t+.32,.08,1.4);}
  function sFinal(){if(!soundOn)return;const a=audio();if(!a)return;const t=a.currentTime+.01;[0,4,7,12,16,19,24].forEach((s,j)=>note(s-12,t+j*.09,.24,1.6));}

  const toastEl=document.getElementById('toast');let tt;
  function toast(h){toastEl.innerHTML=h;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('on'),1900);}

  function tick(){
    const target=count*UNIT_CM/100,now=performance.now();
    if(!anim||anim.h1!==target)anim={h0:dispH,h1:target,c0:shown,c1:count,t0:now,d:reduce?1:1250};
    const p=Math.min(1,(now-anim.t0)/anim.d),e=1-Math.pow(1-p,3);
    dispH=lerp(anim.h0,anim.h1,e);shown=lerp(anim.c0,anim.c1,e);
    camTop=lerp(camTop,desiredTop(),.035);glow=Math.max(0,glow-.02);
    hud();draw();
    raf=(p<1||Math.abs(camTop-desiredTop())>camTop*.002||glow>0)?requestAnimationFrame(tick):0;
  }
  const run=()=>{if(!raf)raf=requestAnimationFrame(tick);};
  function stageFrom(){return stage===0?0:STG[stage-1].h*1.04;}
  function stageTo(){return stage<STG.length?STG[stage].h*1.04:TOTAL_H;}
  function nT(){return stage<STG.length?TAPS(stage):3;}
  function add(){
    if(count>=TOTAL){toast(T(U.fin,{h:fmtM(TOTAL_H),m:fmtM(PLANE-TOTAL_H)}));sFinal();return;}
    tap++;const n=nT(),h=lerp(stageFrom(),stageTo(),tap/n);
    count=Math.min(TOTAL,Math.max(count+1,Math.ceil(h/(UNIT_CM/100))));
    const btn=document.getElementById('add');btn.classList.remove('pulse');void btn.offsetWidth;btn.classList.add('pulse');
    if(tap>=n){
      if(stage<STG.length){const l=STG[stage];stage++;tap=0;sPass();glow=1;toast(T(U.pass,{x:NM[l.id]})+' · <i>'+fmtM(l.h)+'</i>');}
      else{count=TOTAL;tap=0;stage++;sFinal();glow=1;toast(T(U.fin,{h:fmtM(TOTAL_H),m:fmtM(PLANE-TOTAL_H)}));}
    }else sTap(stage%6+tap);
    hud();run();
  }
  function hud(){
    document.getElementById('hH').textContent=fmtM(dispH);
    document.getElementById('hC').textContent=T(U.cnt,{n:fmt(shown)});
    const N=nextL();
    document.getElementById('hN').textContent=N?T(U.next,{x:NM[N.id],h:fmtM(N.h)}):(count<TOTAL?T(U.next,{x:fmtM(TOTAL_H),h:''}).replace(/\s*\(\s*\)/,''):T(U.fin,{h:fmtM(TOTAL_H),m:fmtM(PLANE-TOTAL_H)}));
    const n=nT();document.getElementById('taps').innerHTML=count>=TOTAL?'':Array.from({length:n},(_,i)=>'<i'+(i<tap?' class="on"':'')+'></i>').join('');
    document.getElementById('pb').style.width=(Math.min(stage,STG.length+1)/(STG.length+1)*100)+'%';
    document.getElementById('pt').textContent=T(U.of,{a:fmt(count),b:fmt(TOTAL)});
  }
  function applyLang(code){
    LG=UI[code]?code:'tr';U=UI[LG];
    const names=NAMES[LG].split('|');LM.forEach((l,i)=>NM[l.id]=names[i]);
    document.documentElement.lang=LG;document.documentElement.dir=U.dir||'ltr';
    document.getElementById('sub').textContent=U.sub;document.getElementById('ttl').innerHTML=U.h;document.getElementById('tag').textContent=U.tag;
    document.getElementById('addT').textContent=U.add;document.getElementById('end').textContent=U.end;document.getElementById('reset').textContent=U.reset;document.getElementById('how').textContent=U.how;
    document.getElementById('howBox').textContent=T(U.note,{p:fmt(PATIENTS),t:fmt(TOTAL)});
    cv.setAttribute('aria-label',U.aria);sel.setAttribute('aria-label',U.lang);sel.value=LG;sndB.title=U.snd;sndB.setAttribute('aria-label',U.snd);
    const bk=document.getElementById('back');if(bk)bk.textContent=U.back;
    try{localStorage.setItem('mdk-lang',LG);}catch(e){}
    hud();draw();
  }
  const sel=document.getElementById('lang'),sndB=document.getElementById('snd');
  sel.innerHTML=ORDER.map(k=>'<option value="'+k+'">'+k.toUpperCase()+' · '+UI[k].label+'</option>').join('');
  sel.addEventListener('change',()=>applyLang(sel.value));
  sndB.setAttribute('aria-pressed',soundOn);
  sndB.addEventListener('click',()=>{soundOn=!soundOn;sndB.setAttribute('aria-pressed',soundOn);try{localStorage.setItem('mdk-snd',soundOn?'1':'0');}catch(e){}if(soundOn)sTap(4);});
  document.getElementById('add').addEventListener('click',add);
  cv.addEventListener('click',add);
  document.getElementById('end').addEventListener('click',()=>{stage=STG.length+1;tap=0;count=TOTAL;glow=1;sFinal();toast(T(U.fin,{h:fmtM(TOTAL_H),m:fmtM(PLANE-TOTAL_H)}));hud();run();});
  document.getElementById('reset').addEventListener('click',()=>{stage=0;tap=0;count=0;shown=0;dispH=0;camTop=.12;anim=null;hud();draw();});
  document.getElementById('how').addEventListener('click',()=>{const b=document.getElementById('howBox');b.hidden=!b.hidden;});
  document.getElementById('howBox').addEventListener('click',e=>{e.currentTarget.hidden=true;});
  document.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&(e.target===document.body||e.target===cv)){e.preventDefault();add();}});
  ['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(soundOn)audio();},{passive:true,capture:true}));
  const bk=document.getElementById('back');if(bk)bk.addEventListener('click',()=>{if(history.length>1)history.back();else location.href='./';});
  let start='tr';try{const s=localStorage.getItem('mdk-lang');if(s&&UI[s])start=s;}catch(e){}
  size();applyLang(start);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
})();
</script>

</body></html>
